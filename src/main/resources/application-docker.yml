spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/blogapp
    driver-class-name: org.postgresql.Driver
    username: blogapp
    password: blogapp
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
  mvc:
    static-path-pattern: /static/**
