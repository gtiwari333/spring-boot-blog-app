global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'blog-app'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'blog-app-1:8080'
          - 'blog-app-2:8080'
          # for app running from IDE (host machine)
          - 'host.docker.internal:8080'
