upstream blog_backend {
    # Hash on JSESSIONID for sticky sessions.
    # Spring Security sets a session on the first request (for CSRF),
    # so by the time you log in, nginx already routes you consistently.
    # Works when all clients share the same IP (localhost testing).
    hash $cookie_JSESSIONID consistent;
    server blog-app-1:8080;
    server blog-app-2:8080;
}

server {
    listen 80;

    location / {
        proxy_pass http://blog_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
